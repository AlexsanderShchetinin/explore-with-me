server.port: 8181

ewm-stats-server.url: http://localhost:9090

keycloak:
  realm: ewm_main_service
  url: http://localhost:8282/
  secret: ydzS7J1ghlDDWKyeX0NTL150RMbUaUhn
  client:
    id: ewmmain

spring:
  allow-bean-definition-overriding: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8282/realms/ewm_main_service
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ewmmain
            client-secret: ydzS7J1ghlDDWKyeX0NTL150RMbUaUhn
            client-name: ewmmain
            authorization-grant-type: authorization_code
            scope: openid, profile, email

  datasource:
    username: main
    password: main
    url: jdbc:postgresql://localhost:5002/ewm_main_db
    properties:
      schema: ewm_prime

  flyway:
    enabled: true
    create-schemas: true
    schemas: ewm_prime
    url: jdbc:postgresql://localhost:5002/ewm_main_db
    user: main
    password: main
    locations : classpath:db/migration

  jpa:
    properties:
      hibernate.dialect: "org.hibernate.dialect.PostgreSQLDialect"
    show-sql: false
    hibernate.ddl-auto: none
    properties.hibernate:
      format_sql: true
  sql:
    init.mode: always

logging:
  level:
    org.flywaydb: DEBUG

