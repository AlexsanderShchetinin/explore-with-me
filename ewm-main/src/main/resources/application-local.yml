server.port: 8080

ewm-stats-server.url: http://localhost:9090

spring:
  allow-bean-definition-overriding: true
#  security:
#    oauth2:
#      resoureserver:
#        jwt:
#          issuer-uri:
#          jwk-set-uri:

  datasource:
    username: main
    password: main
    url: jdbc:postgresql://localhost:5002/ewm_main_db
    properties:
      schema: ewm_prime

  flyway:
    enabled: true
    create-schemas: true
    schemas: ewm_prime
    #url: jdbc:postgresql://localhost:5002/ewm_main_db
    user: main
    password: main
    locations : classpath:db/migration

  jpa:
    properties:
      hibernate.dialect: "org.hibernate.dialect.PostgreSQLDialect"
    show-sql: false
    hibernate.ddl-auto: none
    properties.hibernate:
      format_sql: true
  sql:
    init.mode: always

logging:
  level:
    org.flywaydb: DEBUG


keycloak:
  realm:
  url: http://localhost:8282/
  secret: secret
  client:
    id: explore-with-me-service